services:
  - type: web
    name: airwatch-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn airwatch.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SEED
        value: "7"
      # Optional. Without it the assistant uses zero LLM tokens.
      - key: ANTHROPIC_API_KEY
        sync: false
